version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: segundo_cerebro_postgres
    environment:
      POSTGRES_USER: segundo
      POSTGRES_PASSWORD: segundo
      POSTGRES_DB: segundo_cerebro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: segundo_cerebro_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
